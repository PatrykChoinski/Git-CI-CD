name: Reusable Deploy
on: 
  workflow_call:  
    inputs:
      artifact-name:
        description: 'Name of the artifact to download'
        required: true
        type: string
        default : 'dist-files'
      environment:
        required: false
        type: string
        default: 'production'
    secrets:
      MONGODB_CLUSTER_ADDRESS:
        required: true
    outputs:
      result:
        description: 'The result of the deployment'
        value: ${{ jobs.deploy.outputs.outcome  }}
jobs:
  deploy:
    outputs:
      outcome: ${{ steps.set-result.outputs.result }}
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/download-artifact@v7
        with:
          name: ${{ github.event.inputs.artifact-name }}
      - name: List files
        run: ls
      - name: Output information
        run: |
          echo "Deplying to environment: ${{ github.event.inputs.environment }}"
      - name: Set Result Output
        id: set-result
        run: echo "set-result=Deployment completed successfully" >> $GITHUB_OUTPUT
